name: Deploy project website

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://linlisworkteam.github.io/domain-knowledge/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect GitHub Pages source
        id: pages-source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pages_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          pages_config="$(
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${pages_api}"
          )"
          current_build_type="$(jq -er '.build_type' <<<"${pages_config}")"
          if [ "${current_build_type}" = "workflow" ]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          current_source_branch="$(jq -er '.source.branch' <<<"${pages_config}")"
          if [ "${current_source_branch}" != "main" ]; then
            echo "::error::Pages legacy source branch must be main, got ${current_source_branch}."
            exit 1
          fi
          echo "deploy=false" >> "${GITHUB_OUTPUT}"
          echo "::notice::Pages Source is ${current_build_type}; the legacy Jekyll publisher will render the root compatibility entrypoint."

      - name: Configure Pages
        if: steps.pages-source.outputs.deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload static site
        if: steps.pages-source.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        if: steps.pages-source.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
