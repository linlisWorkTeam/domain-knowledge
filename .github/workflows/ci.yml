name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser for Console tests
        run: npx playwright install --with-deps chromium

      - name: Type-check
        run: npm run typecheck

      - name: Validate specifications
        run: npm run validate:specs

      - name: Run test suite
        run: npm test

      - name: Run Console browser tests
        run: npm run test:ui
