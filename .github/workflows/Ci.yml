# 文件功能：按变更范围运行验证，昂贵验收使用独立环境。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      acceptance: ${{ steps.changes.outputs.acceptance }}
    steps:
      - name: Check out tested revision and its first parent
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch previous main tip for multi-commit pushes
        if: github.event_name == 'push'
        env:
          VERIFICATION_BASE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$VERIFICATION_BASE"
          echo "VERIFICATION_BASE=$VERIFICATION_BASE" >> "$GITHUB_ENV"

      - name: Select checks for changed files
        id: changes
        run: node scripts/VerificationRouter.ts

      - name: Static document and specification lint
        run: npm run spec:lint

      - name: Install dependencies for runtime checks
        if: steps.changes.outputs.runtime == 'true'
        run: npm ci

      - name: Install and verify Linux isolation
        if: steps.changes.outputs.runtime == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # 仅给临时 CI 机的 bwrap 授予 userns；不关闭全局 AppArmor，也不修改 ECS 内核策略。
          # https://discourse.ubuntu.com/t/ubuntu-24-04-lts-noble-numbat-release-notes/39890
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --unshare-all --die-with-parent --ro-bind / / --proc /proc --dev /dev /bin/true

      - name: Type-check
        if: steps.changes.outputs.runtime == 'true'
        run: npm run typecheck

      - name: Validate machine schema fixtures
        if: steps.changes.outputs.contracts == 'true'
        run: node scripts/ValidateContracts.ts

      - name: Run scoped checks
        env:
          VERIFICATION_SCOPES: ${{ steps.changes.outputs.scopes }}
          VERIFICATION_RUNTIME: ${{ steps.changes.outputs.runtime }}
        # Acceptance runs below in its own environment.
        run: |
          if [ "$VERIFICATION_RUNTIME" = true ]; then
            bash scripts/RunIsolatedCi.sh node scripts/VerificationRouter.ts --run "${VERIFICATION_SCOPES//,acceptance/}"
          else
            node scripts/VerificationRouter.ts --run "${VERIFICATION_SCOPES//,acceptance/}"
          fi

      - name: Install Chinese fonts for affected UI
        if: steps.changes.outputs.web == 'true'
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install browser for affected UI
        if: steps.changes.outputs.web == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Console browser tests
        if: steps.changes.outputs.web == 'true'
        run: bash scripts/RunIsolatedCi.sh npm run test:ui

      - name: Preserve failed visual comparisons
        if: failure() && steps.changes.outputs.web == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: console-visual-comparisons
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
  acceptance:
    needs: verify
    if: needs.verify.outputs.acceptance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install and verify Linux isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # 仅给临时 CI 机的 bwrap 授予 userns；不关闭全局 AppArmor，也不修改 ECS 内核策略。
          # https://discourse.ubuntu.com/t/ubuntu-24-04-lts-noble-numbat-release-notes/39890
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --unshare-all --die-with-parent --ro-bind / / --proc /proc --dev /dev /bin/true

      - name: Fetch only the DocGen reference source and test commits
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { DOCGEN_SOURCE_COMMIT, DOCGEN_REFERENCE_TEST_COMMIT } from './src/domain/agents/docGenAgent/examples/DocGenReference.ts';
          for (const commit of new Set([DOCGEN_SOURCE_COMMIT, DOCGEN_REFERENCE_TEST_COMMIT])) {
            execFileSync('git', ['fetch', '--no-tags', '--depth=1', 'origin', commit], { stdio: 'inherit' });
          }
          NODE
      - run: bash scripts/RunIsolatedCi.sh npm run test:acceptance
