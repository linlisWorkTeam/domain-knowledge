# 文件功能：维护ci相关的项目配置与工程说明。
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # DocGen integration tests evaluate a pinned historical source commit.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Select checks for changed files
        id: changes
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          // PR checkout is the merge commit; its first parent is the tested base.
          const files = process.env.GITHUB_EVENT_NAME === 'pull_request'
            ? execFileSync('git', ['diff', '--no-renames', '--name-only', '-z', 'HEAD^1', 'HEAD'], { encoding: 'utf8' }).split('\0').filter(Boolean)
            : [];
          const docsOnly = files.length > 0 && files.every((file) => /^(?:[^/]+\.md|docs\/.*\.md)$/.test(file));
          appendFileSync(process.env.GITHUB_OUTPUT, `docs-only=${docsOnly}\n`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Install and verify Linux isolation
        if: steps.changes.outputs.docs-only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --unshare-all --die-with-parent --ro-bind / / --proc /proc --dev /dev /bin/true

      - name: Type-check
        if: steps.changes.outputs.docs-only != 'true'
        run: npm run typecheck

      - name: Validate specifications
        run: npm run validate:specs

      - name: Check documentation contracts
        if: steps.changes.outputs.docs-only == 'true'
        run: node --test tests/contract/*.test.ts

      - name: Run test suite
        if: steps.changes.outputs.docs-only != 'true'
        run: npm test

      - name: Install browser for Console tests
        if: steps.changes.outputs.docs-only != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Console browser tests
        if: steps.changes.outputs.docs-only != 'true'
        run: npm run test:ui
